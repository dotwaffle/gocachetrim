name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # All checks run in one job, because Go setup takes more time than most
  # of the checks. Each check after the first runs also when an earlier
  # check fails, so that one run reports all failures.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          # The module has no go.sum, because it has no dependencies.
          cache-dependency-path: go.mod
      - name: Check go.mod
        run: go mod tidy -diff
      - name: Test
        if: ${{ !cancelled() }}
        run: go test -race ./...
      - name: Vet other platforms
        # The tests run on Linux and macOS only. Vet the other platforms
        # so that the build tags for flock and st_blocks stay correct.
        if: ${{ !cancelled() }}
        run: |
          status=0
          for goos in freebsd netbsd openbsd dragonfly illumos windows; do
            echo "::group::GOOS=$goos"
            GOOS=$goos go vet ./... || status=1
            echo "::endgroup::"
          done
          exit "$status"
      - uses: golangci/golangci-lint-action@v9
        if: ${{ !cancelled() }}
        with:
          # A new minor version can add checks, so update it on purpose.
          version: v2.14
      - name: govulncheck
        if: ${{ !cancelled() }}
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - uses: rvben/rumdl@v0
        if: ${{ !cancelled() }}
        with:
          report-type: annotations

  test-macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: go.mod
      - name: Test
        run: go test -race ./...
